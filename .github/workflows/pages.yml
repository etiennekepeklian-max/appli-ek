name: Verifier et publier EK Logistique
on:
  push:
    branches: [main, fix/android-opening, fix/android-play-protect, feat/android-management, feat/activity-log, feat/personal-pin, codex/enf-voice-search-20261030, codex/yellow-buttons-20261030, codex/simple-ui-20261030, codex/enf-concepts-20261030, codex/mascot-no-thumb-20261030, codex/bureau-admin-20261029, codex/lookup-photos-cache-20261029, security/pin-admin-web-reconcilie-20261028, codex/pikeo-product-lookup-20261029, codex/pikeo-web-11710-admin-cache, codex/pikeo-administration-comptes-20261028, integration/web-sans-android-20261028, codex/pikeo-opening-1.17.1, codex/pikeo-unified-loading-1.17.2, codex/pikeo-manquant-raccourci-1173, codex/pikeo-contacts-reassort-prives, codex/pikeo-manquant-emplacement-facultatif-1176, codex/pikeo-message-reassort-modele-1-1177, codex/pikeo-supprimer-manquant-1178, codex/terrain-v1.3, codex/mobile-v1.4, codex/mobile-v1.5, codex/ergonomie-v1.6, codex/web-v1.9, codex/sessions-v1.10, codex/update-v1.10.1, codex/enfs-v1.11, codex/web-finish-v1.12, codex/ux-v1.13, codex/day-v1.14, codex/undo-v1.14.1, codex/audit-v1.15, codex/order-ocr-v1.16, codex/day-independent-v1.16.2, codex/day-management-v1.16.3, codex/manual-picking-v1.17.0]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier le projet
        run: npm test && npm run check
      - name: Préparer le cache hors ligne
        run: node tools/prepare.mjs
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          google-chrome --version
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Verifier les parcours mobiles
        run: node --import ./tools/qa-auth-preload.mjs tools/ownership-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/product-lookup-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/cache-cleanup-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/ui-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/workflow-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/document-day-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/day-restart-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/undo-choice-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/day-tools-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/workbench-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/cloud-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/catalogue-photo-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/desktop-smoke.mjs && node tools/desktop-public-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - name: Vérifier la recherche publique avec une photo
        if: github.ref == 'refs/heads/main'
        run: node --import ./tools/qa-auth-preload.mjs tools/product-lookup-live-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-ui-checks
          path: test-results
  sessions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/entry-management-smoke.mjs && node tools/user-pin-smoke.mjs && node tools/sessions-smoke.mjs && node tools/activity-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sessions-ui-checks
          path: test-results
  updates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node --import ./tools/qa-auth-preload.mjs tools/update-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updates-ui-checks
          path: test-results
  enfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node --import ./tools/qa-auth-preload.mjs tools/enf-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/enf-voice-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enf-ui-checks
          path: test-results
  webtools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node --import ./tools/qa-auth-preload.mjs tools/web-tools-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webtools-ui-checks
          path: test-results
  ergonomics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node --import ./tools/qa-auth-preload.mjs tools/simple-ui-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/ergonomics-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ergonomics-ui-checks
          path: test-results
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node --import ./tools/qa-auth-preload.mjs tools/picking-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/diagnostic-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/order-ocr-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/photo-review-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/day-independent-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/day-management-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/photos-voice-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-ui-checks
          path: test-results
  security-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pikeo_pin_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pikeo_pin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false postgres@3.4.9
      - run: node tools/personal-pin-db-contract.mjs
        env:
          PIKEO_CONTRACT_DB_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/pikeo_pin_test
      - name: Vérifier le serveur PIN publié
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/pin-admin-web-reconcilie-20261028'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch('https://wcmuffmyozjolaaahhff.supabase.co/functions/v1/pikeo-api',{signal:AbortSignal.timeout(20000),headers:{'Cache-Control':'no-cache'}});
          assert.equal(response.status,200,'Le serveur doit répondre avant publication.');
          const health=await response.json();
          assert.equal(health.app,'Pikeo');
          assert.equal(health.version,'2.0.0');
          assert.equal(health.personalPinRequired,true);
          assert.equal(health.status,'ready');
          assert.equal(health.bureauAdminOnly,true);
          assert.equal(health.adminPinReady,true,'Le secret serveur PIN doit être configuré.');
          console.log('Serveur PIN personnel et Bureau 2.0.0 disponible ; configuration du secret validée sans lire sa valeur.');
          NODE
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, sessions, updates, enfs, webtools, ergonomics, diagnostics, security-db]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le cache hors ligne
        run: node tools/prepare.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Attendre le fichier de publication unique
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner:context.repo.owner,repo:context.repo.repo,run_id:context.runId,per_page:100});
              const matches = data.artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length === 1) { core.info(`Fichier de publication prêt : ${name}`); return; }
              if (matches.length > 1) throw new Error('Plusieurs fichiers de publication identiques.');
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Le fichier de publication reste indisponible.');
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Vérifier la version web publiée
        env:
          PIKEO_PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const {VERSION}=await import('./site/js/core.js');
          const base=process.env.PIKEO_PUBLISHED_URL;
          assert.ok(base?.startsWith('https://etiennekepeklian-max.github.io/'));
          let verified=false;
          for(let attempt=0;attempt<6;attempt++){
            try{
              const release=await fetch(new URL('release.json?publication='+Date.now(),base),{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
              assert.equal(release.status,200);
              assert.equal((await release.json()).version,VERSION);
              const module=await fetch(new URL('js/admin-pin-ui.js?publication='+Date.now(),base),{signal:AbortSignal.timeout(15000)});
              assert.equal(module.status,200);
              assert.ok((await module.text()).includes("API.request('admin-pin-enroll'"));
              for(const [path,marker] of [['js/product-image.js','publicProductPhoto'],['js/cache-cleanup.js','installCacheCleanup'],['js/bureau-entry.js','authorizeBureau'],['js/simple-ui.js','homeActions']]){
                const resource=await fetch(new URL(path+'?publication='+Date.now(),base),{signal:AbortSignal.timeout(15000)});
                assert.equal(resource.status,200);assert.ok((await resource.text()).includes(marker));
              }
              verified=true;break;
            }catch(error){
              if(attempt===5)throw error;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
          }
          assert.ok(verified);
          console.log('Pikéo web '+VERSION+' et interface PIN vérifiés sur le site public.');
          NODE

