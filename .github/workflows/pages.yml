name: Verifier et publier EK Logistique
on:
  push:
    branches: [main, codex/lookup-photos-cache-20261029, security/pin-admin-web-reconcilie-20261028, codex/pikeo-product-lookup-20261029, codex/pikeo-web-11710-admin-cache, codex/pikeo-administration-comptes-20261028, integration/web-sans-android-20261028, codex/pikeo-opening-1.17.1, codex/pikeo-unified-loading-1.17.2, codex/pikeo-manquant-raccourci-1173, codex/pikeo-contacts-reassort-prives, codex/pikeo-manquant-emplacement-facultatif-1176, codex/pikeo-message-reassort-modele-1-1177, codex/pikeo-supprimer-manquant-1178, codex/terrain-v1.3, codex/mobile-v1.4, codex/mobile-v1.5, codex/ergonomie-v1.6, codex/web-v1.9, codex/sessions-v1.10, codex/update-v1.10.1, codex/enfs-v1.11, codex/web-finish-v1.12, codex/ux-v1.13, codex/day-v1.14, codex/undo-v1.14.1, codex/audit-v1.15, codex/order-ocr-v1.16, codex/day-independent-v1.16.2, codex/day-management-v1.16.3, codex/manual-picking-v1.17.0]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier le projet
        run: npm test && npm run check
      - name: Préparer le cache hors ligne
        run: node tools/prepare.mjs
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          google-chrome --version
      - name: Verifier les parcours mobiles
        run: node tools/product-lookup-smoke.mjs && node tools/ui-smoke.mjs && node tools/workflow-smoke.mjs && node tools/document-day-smoke.mjs && node tools/day-restart-smoke.mjs && node tools/undo-choice-smoke.mjs && node tools/day-tools-smoke.mjs && node tools/workbench-smoke.mjs && node tools/cloud-smoke.mjs && node tools/catalogue-photo-smoke.mjs && node tools/desktop-smoke.mjs && node tools/desktop-public-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-ui-checks
          path: test-results
  sessions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/sessions-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sessions-ui-checks
          path: test-results
  updates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/update-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updates-ui-checks
          path: test-results
  enfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/enf-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enf-ui-checks
          path: test-results
  webtools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/web-tools-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webtools-ui-checks
          path: test-results
  ergonomics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/ergonomics-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ergonomics-ui-checks
          path: test-results
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/picking-smoke.mjs && node tools/diagnostic-smoke.mjs && node tools/order-ocr-smoke.mjs && node tools/photo-review-smoke.mjs && node tools/day-independent-smoke.mjs && node tools/day-management-smoke.mjs && node tools/photos-voice-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-ui-checks
          path: test-results
  security-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pikeo_pin_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pikeo_pin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false postgres@3.4.9
      - run: node tools/admin-pin-db-contract.mjs
        env:
          PIKEO_CONTRACT_DB_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/pikeo_pin_test
      - name: Vérifier le serveur PIN publié
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/pin-admin-web-reconcilie-20261028'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch('https://wcmuffmyozjolaaahhff.supabase.co/functions/v1/pikeo-api',{signal:AbortSignal.timeout(20000),headers:{'Cache-Control':'no-cache'}});
          assert.equal(response.status,200,'Le serveur doit répondre avant publication.');
          const health=await response.json();
          assert.equal(health.app,'Pikeo');
          assert.equal(health.version,'1.18.0');
          assert.equal(health.status,'ready');
          assert.equal(health.adminPinReady,true,'Le secret serveur PIN doit être configuré.');
          console.log('Serveur PIN 1.18.0 disponible ; configuration du secret validée sans lire sa valeur.');
          NODE
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, sessions, updates, enfs, webtools, ergonomics, diagnostics, security-db]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le cache hors ligne
        run: node tools/prepare.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier la version web publiée
        env:
          PIKEO_PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const {VERSION}=await import('./site/js/core.js');
          const base=process.env.PIKEO_PUBLISHED_URL;
          assert.ok(base?.startsWith('https://etiennekepeklian-max.github.io/'));
          let verified=false;
          for(let attempt=0;attempt<6;attempt++){
            try{
              const release=await fetch(new URL('release.json?publication='+Date.now(),base),{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
              assert.equal(release.status,200);
              assert.equal((await release.json()).version,VERSION);
              const module=await fetch(new URL('js/admin-pin-ui.js?publication='+Date.now(),base),{signal:AbortSignal.timeout(15000)});
              assert.equal(module.status,200);
              assert.ok((await module.text()).includes("API.request('admin-pin-enroll'"));
              verified=true;break;
            }catch(error){
              if(attempt===5)throw error;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
          }
          assert.ok(verified);
          console.log('Pikéo web '+VERSION+' et interface PIN vérifiés sur le site public.');
          NODE

