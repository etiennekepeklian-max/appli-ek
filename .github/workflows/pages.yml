name: Verifier et publier EK Logistique
on:
  push:
    branches: [main, security/pin-admin-web-reconcilie-20261028, codex/pikeo-web-11710-admin-cache, codex/pikeo-administration-comptes-20261028, integration/web-sans-android-20261028, codex/pikeo-opening-1.17.1, codex/pikeo-unified-loading-1.17.2, codex/pikeo-manquant-raccourci-1173, codex/pikeo-contacts-reassort-prives, codex/pikeo-manquant-emplacement-facultatif-1176, codex/pikeo-message-reassort-modele-1-1177, codex/pikeo-supprimer-manquant-1178, codex/terrain-v1.3, codex/mobile-v1.4, codex/mobile-v1.5, codex/ergonomie-v1.6, codex/web-v1.9, codex/sessions-v1.10, codex/update-v1.10.1, codex/enfs-v1.11, codex/web-finish-v1.12, codex/ux-v1.13, codex/day-v1.14, codex/undo-v1.14.1, codex/audit-v1.15, codex/order-ocr-v1.16, codex/day-independent-v1.16.2, codex/day-management-v1.16.3, codex/manual-picking-v1.17.0]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier le projet
        run: npm test && npm run check
      - name: Préparer le cache hors ligne
        run: node tools/prepare.mjs
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          google-chrome --version
      - name: Verifier les parcours mobiles
        run: node tools/ui-smoke.mjs && node tools/workflow-smoke.mjs && node tools/document-day-smoke.mjs && node tools/day-restart-smoke.mjs && node tools/undo-choice-smoke.mjs && node tools/day-tools-smoke.mjs && node tools/workbench-smoke.mjs && node tools/cloud-smoke.mjs && node tools/catalogue-photo-smoke.mjs && node tools/desktop-smoke.mjs && node tools/desktop-public-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-ui-checks
          path: test-results
  sessions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/sessions-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sessions-ui-checks
          path: test-results
  updates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/update-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updates-ui-checks
          path: test-results
  enfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/enf-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enf-ui-checks
          path: test-results
  webtools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/web-tools-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webtools-ui-checks
          path: test-results
  ergonomics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/ergonomics-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ergonomics-ui-checks
          path: test-results
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tools/prepare.mjs && node tools/picking-smoke.mjs && node tools/diagnostic-smoke.mjs && node tools/order-ocr-smoke.mjs && node tools/photo-review-smoke.mjs && node tools/day-independent-smoke.mjs && node tools/day-management-smoke.mjs && node tools/photos-voice-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-ui-checks
          path: test-results
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, sessions, updates, enfs, webtools, ergonomics, diagnostics]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le cache hors ligne
        run: node tools/prepare.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4

