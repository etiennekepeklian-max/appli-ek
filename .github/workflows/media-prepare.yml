name: Préparer Lecture Pause sans APK
on:
  push:
    branches: [feat/media-key-control, release/android-204]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pikeo-media-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --import ./tools/qa-auth-preload.mjs tools/media-control-smoke.mjs && node tools/entry-management-smoke.mjs && node --import ./tools/qa-auth-preload.mjs tools/label-layout-smoke.mjs
        env:
          EK_TEST_BROWSER_CHANNEL: chrome
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier les récurrences et les changements d’heure
        run: mkdir -p /tmp/pikeo-time-test && javac -d /tmp/pikeo-time-test native/android/app/src/main/java/fr/pikeo/logistique/WorkReminderTime.java tools/WorkReminderTimeCheck.java && java -cp /tmp/pikeo-time-test WorkReminderTimeCheck
      - run: npm ci --prefix native
      - run: node tools/prepare-native.mjs && cd native && npx cap sync android
      - name: Compiler et contrôler le Java sans générer d’APK
        working-directory: native/android
        run: chmod +x gradlew && ./gradlew --no-daemon :app:compileDebugJavaWithJavac :app:lintDebug
